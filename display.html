<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">

    <!-- Alpine -->
    <script src="node_modules/alpinejs/dist/cdn.min.js" defer></script>
</head>

<body class="bg-neutral-900 h-full">

<main class="w-full h-screen flex items-center justify-center">
    <section x-data="{
            athleteOne: 0,
            athleteTwo: 0,
            athleteOneName: 'Primeiro Atleta',
            athleteTwoName: 'Segundo Atleta',
            remainingTime: 300
        }"
            x-init="
            athleteOne = Number(localStorage.getItem('athleteOne')) || 0;
            athleteTwo = Number(localStorage.getItem('athleteTwo')) || 0;
            const savedTime = localStorage.getItem('remainingTime');

            remainingTime = savedTime !== null
                ? Number(savedTime)
                : 300;

            window.addEventListener('storage', () => {
                athleteOne = Number(localStorage.getItem('athleteOne')) || 0;
                athleteTwo = Number(localStorage.getItem('athleteTwo')) || 0;
                const savedTime = localStorage.getItem('remainingTime');

                remainingTime = savedTime !== null
                    ? Number(savedTime)
                    : 300;
        });
        " class="w-full h-full grid grid-cols-3 px-[3vw]"
    >

        <!-- ATLETA 1 -->
        <div class="flex flex-col justify-center items-start h-full py-[8vh] gap-[clamp(130px,6vh,120px)]">
<!--            <h2 class="uppercase text-white text-[clamp(24px,3vw,80px)]"-->
<!--                x-text="athleteOneName"></h2>-->
            <!-- =========================================================
            PLACAR DO ATLETA 1 = w-[14vw] = largura da caixa do placar - h-[35vh]  = altura da caixa do placar
                                 text-[clamp(120px,14vw,400px)] - tamanho da fonte do número - mínimo: 120px
                                 tamanho preferencial: 14vw - máximo: 400px
            ========================================================= -->
            <div class="flex justify-end">
                <div class="bg-neutral-800/80 flex items-center justify-center font-bold text-neutral-100 rounded-lg"
                     :class="athleteOne >= 100
                            ? 'w-[20vw] h-[36vh] text-[clamp(120px,12vw,400px)]'
                            : 'w-[16vw] h-[36vh] text-[clamp(120px,14vw,400px)]'">
                    <span x-text="athleteOne"></span>
                </div>
            </div>
        </div>

        <!-- CENTRO (LOGO + TIMER) -->
        <div class="flex flex-col items-center justify-center gap-[clamp(80px,6vh,120px)]">

            <img src="./img/flags/logo-bjj-family-white-sem-fundo.png"
                 class="object-contain w-[clamp(480px,20vw,400px)]">

            <!--            <div class="text-white text-[clamp(80px,8vw,300px)]">-->
            <!--                <span x-text="-->
            <!--                    `${String(Math.floor(remainingTime / 60)).padStart(2,'0')}:${String(remainingTime % 60).padStart(2,'0')}`-->
            <!--                "></span>-->
            <!--            </div>-->
            <!-- =========================================
                 CRONÔMETRO EXCLUSIVO DA TELA 2
            ========================================== -->
            <div class="rounded-xl flex flex-col items-center p-8 shadow-xl w-[20vw]" x-data="displayTimer()" x-init="initTimer()">

                <!-- Mostrador -->
                <!-- RELÓGIO 2 -->
                <div x-data="displayTimer()" x-init="initTimer()">

                    <div style="
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        white-space: nowrap;
                        color: white;
                        font-size: clamp(80px, 8vw, 300px);
                        line-height: 1;">

                        <!-- MINUTO 1 -->
                        <span x-text="String(Math.floor(remainingTime / 60)).padStart(2, '0')[0]"
                              style=" display: inline-block; width: 0.52em; text-align: center;"></span>

                        <!-- MINUTO 2 -->
                        <span x-text="String(Math.floor(remainingTime / 60)).padStart(2, '0')[1]"
                              style=" display: inline-block; width: 0.52em; text-align: center;"></span>

                        <!-- DOIS PONTOS -->
                        <span style=" display: inline-block; width: 0.28em; text-align: center;">:</span>

                        <!-- SEGUNDO 1 -->
                        <span x-text="String(remainingTime % 60).padStart(2, '0')[0]"
                              style=" display: inline-block; width: 0.52em; text-align: center;"></span>

                        <!-- SEGUNDO 2 -->
                        <span x-text="String(remainingTime % 60).padStart(2, '0')[1]"
                              style=" display: inline-block; width: 0.52em; text-align: center;"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ATLETA 2 -->
        <div class="flex flex-col justify-center items-end h-full py-[8vh] gap-[clamp(130px,6vh,120px)]">
<!--            <h2 class="uppercase text-white text-[clamp(24px,3vw,80px)]"-->
<!--                x-text="athleteTwoName"></h2>-->
            <!-- =========================================================
            PLACAR DO ATLETA 2 = w-[14vw] = largura da caixa do placar - h-[35vh]  = altura da caixa do placar
                                 text-[clamp(120px,14vw,400px)] - tamanho da fonte do número - mínimo: 120px
                                 tamanho preferencial: 14vw - máximo: 400px
            ========================================================= -->
            <div class="flex justify-end">
                <div class="bg-green-800 flex items-center justify-center font-bold text-yellow-400 rounded-lg"
                     :class="athleteTwo >= 100
                            ? 'w-[20vw] h-[36vh] text-[clamp(120px,12vw,400px)]'
                            : 'w-[16vw] h-[36vh] text-[clamp(120px,14vw,400px)]'">
                    <span x-text="athleteTwo"></span>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="js/app.js"></script>

</body>
</html>
