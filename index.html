<!DOCTYPE html>
<html lang="pt-BR" class="h-full" xmlns:x-on="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJJ-Family-Placar</title>
    <link rel="stylesheet" href="css/fontawesome/all.min.css">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="node_modules/alpinejs/dist/cdn.min.js" defer></script>
    <script src="node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
    <link rel="stylesheet" href="node_modules/sweetalert2/dist/sweetalert2.min.css">
</head>

<body class="bg-neutral-900 h-full">

<main class="grid grid-flow-col grid-cols-12 grid-rows-3 w-full">
    <section x-data="{
    athleteOne: 0,
    athleteTwo: 0,
    athleteOneName: 'Primeiro Atleta',
    athleteTwoName: 'Segundo Atleta',
    matchActive: false
    }"
    x-on:reset-score.window="
    athleteOne = 0;
    athleteTwo = 0;
    matchActive = false;
    "
     x-on:match-started.window="matchActive = true"
     x-on:match-ended.window="matchActive = false"

            class="h-screen w-screen flex items-center justify-center bg-neutral-900 overflow-hidden"
    >

        <div class="w-full h-full grid grid-cols-3 px-[3vw]">
            <!-- =========================
                 ATLETA 1 (ESQUERDA)
            ========================== -->
            <div class="flex flex-col justify-center items-start h-full py-[6vh] gap-[clamp(90px,6vh,120px)]">
                <!-- Nome -->
                <div class="flex gap-4 items-start w-full">
                    <!--				<img src="./img/flags/logo-bjj-family-white-sem-fundo.png" class="h-full w-24 object-cover" alt="">-->
                    <h2 class="uppercase text-white text-[clamp(24px,3vw,80px)]" x-text="athleteOneName"></h2>
                </div>
                <!-- Botões -->
                <div>
                    <ul class="flex gap-8 justify-between">
                        <li>
                            <button
                                    @click="matchActive && (athleteOne += 2)"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                +2
                            </button>
                        </li>
                        <li>
                            <button
                                    @click="matchActive && (athleteOne += 3)"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                +3
                            </button>
                        </li>
                        <li>
                            <button
                                    @click="matchActive && (athleteOne += 4)"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                +4
                            </button>
                        </li>
                    </ul>

                    <ul class="flex gap-8 mt-4 justify-end">
                        <li>
                            <button
                                    @click="matchActive && (athleteOne = Math.max(0, athleteOne - 2))"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                -2
                            </button>
                        </li>
                        <li>
                            <button
                                    @click="matchActive && (athleteOne = Math.max(0, athleteOne - 3))"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                -3
                            </button>
                        </li>
                        <li>
                            <button
                                    @click="matchActive && (athleteOne = Math.max(0, athleteOne - 4))"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                -4
                            </button>
                        </li>
                    </ul>
                </div>
                <!-- Placar -->
                <div class="flex justify-end">
                    <div
                            class="bg-neutral-800/80 flex items-center justify-center font-bold text-neutral-100 rounded-lg"
                            :class="athleteOne >= 100
                            ? 'w-[20vw] h-[28vh] text-[clamp(120px,12vw,400px)]'
                            : 'w-[14vw] h-[28vh] text-[clamp(120px,12vw,400px)]'"
                    >
                        <span x-text="athleteOne"></span>
                    </div>
                </div>
            </div>

            <!-- =========================
                 RELÓGIO (CENTRO)
            ========================== -->
            <div class="flex flex-col items-center justify-center h-full py-[6vh] gap-[clamp(80px,6vh,120px)]">
                <!-- LOGO (ACIMA DO RELÓGIO) -->
                <div class="flex justify-center items-center mt-8">
                    <!-- Coloque seu logo aqui -->
                    <img src="./img/flags/logo-bjj-family-white-sem-fundo.png"
                         alt="Logo"
                         class="fa-box-up object-contain w-[14vw] h-[14vw]">
                </div>

                <div class="rounded-xl flex flex-col items-center p-8 shadow-xl w-[20vw]"
                     x-data="timer()">

                    <!-- Mostrador -->
                    <h1
                            x-text="formatTime(remainingTime)"
                            class="text-[clamp(80px,8vw,300px)] text-white tabular-nums mb-6">
                    </h1>

                    <!-- Controles -->
                    <div class="flex flex-col items-center gap-6 w-full">
                        <button class="text-white text-4xl"
                                x-on:click="toggleTimer()">
                            <i class="fa-solid fa-pause" x-show="isRunning"></i>
                            <i class="fa-solid fa-play" x-show="!isRunning"></i>
                        </button>
                        <div class="flex gap-6">
                            <button class="btn px-6 py-2 bg-neutral-800 text-white hover:bg-white/10"
                                    x-on:click="setTime(2)">2m
                            </button>
                            <button class="btn px-6 py-2 bg-neutral-800 text-white hover:bg-white/10"
                                    x-on:click="setTime(3)">3m
                            </button>
                            <button class="btn px-6 py-2 bg-neutral-800 text-white hover:bg-white/10"
                                    x-on:click="setTime(5)">5m
                            </button>
                        </div>
                    </div>
                </div>
            </div>


            <!-- =========================
                 ATLETA 2 (DIREITA)
            ========================== -->
            <div class="flex flex-col justify-center items-end h-full py-[6vh] gap-[clamp(90px,6vh,120px)]">
                <!-- Nome -->
                <div class="flex gap-4 items-center w-full justify-end">
                    <!--				<img src="./img/flags/logo-bjj-family-white-sem-fundo.png" class="h-full w-24 object-cover" alt="">-->
                    <h2 class="uppercase text-white text-[clamp(24px,3vw,80px)]" x-text="athleteTwoName"></h2>
                </div>

                <!-- Botões -->
                <div>
                    <ul class="flex gap-8 justify-end">
                        <li>
                            <button
                                    @click="matchActive && (athleteTwo += 2)"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                +2
                            </button>
                        </li>
                        <li>
                            <button
                                    @click="matchActive && (athleteTwo += 3)"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                +3
                            </button>
                        </li>
                        <li>
                            <button
                                    @click="matchActive && (athleteTwo += 4)"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                +4
                            </button>
                        </li>
                    </ul>
                    <ul class="flex gap-8 mt-4 justify-end">
                        <li>
                            <button
                                    @click="matchActive && (athleteTwo = Math.max(0, athleteTwo - 2))"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                -2
                            </button>
                        </li>
                        <li>
                            <button
                                    @click="matchActive && (athleteTwo = Math.max(0, athleteTwo - 3))"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                -3
                            </button>
                        </li>
                        <li>
                            <button
                                    @click="matchActive && (athleteTwo = Math.max(0, athleteTwo - 4))"
                                    :disabled="!matchActive"
                                    :class="!matchActive
                    ? 'opacity-30 cursor-not-allowed bg-neutral-700'
                    : 'bg-neutral-800 hover:bg-white/10'"
                                    class="btn w-10 h-12 text-white transition">
                                -4
                            </button>
                        </li>
                    </ul>
                </div>
                <!-- Placar -->
                <div class="flex justify-end">
                    <div
                            class="bg-green-800 flex items-center justify-center font-bold text-yellow-400 rounded-lg"
                            :class="athleteTwo >= 100
                            ? 'w-[20vw] h-[28vh] text-[clamp(120px,12vw,400px)]'
                            : 'w-[14vw] h-[28vh] text-[clamp(120px,12vw,400px)]'"
                    >
                        <span x-text="athleteTwo"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
<audio id="endSound" src="./sounds/beep.mp3" preload="auto"></audio>
</body>
</html>
